name: Sync upstream branch

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/sst/opencode.git
          git fetch upstream dev

      - name: Check if sync needed
        id: check
        run: |
          UPSTREAM_SHA=$(git rev-parse upstream/dev)
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          if git ls-remote origin 'refs/heads/upstream-sync/*' | awk '{print $1}' | grep -qx "$UPSTREAM_SHA"; then
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
            echo "No new upstream changes since last sync."
          else
            echo "needs_sync=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create sync branch
        if: steps.check.outputs.needs_sync == 'true'
        run: |
          DATE=$(date -u +%Y-%m-%d)
          SHORT_SHA=$(git rev-parse --short upstream/dev)
          BRANCH="upstream-sync/${DATE}-${SHORT_SHA}"
          git push origin "upstream/dev:refs/heads/${BRANCH}"
          echo "Branch created: $BRANCH"
